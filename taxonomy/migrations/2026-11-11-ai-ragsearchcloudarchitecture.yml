schema_version: 2
id: 2026-11-11-ai-ragsearchcloudarchitecture
description: Review proposed taxonomy additions for docs/case-studies/RagSearchCloudArchitecture.md.
change_type: vocabulary-expansion
trigger: content-driven
governance:
  date: '2026-11-11'
  source: ai-proposed
  reason: 'DeepSeek review of docs/case-studies/RagSearchCloudArchitecture.md: technologies.azure-application-insights:
    The document plans to export telemetry to Azure Application Insights; no existing term covers this
    service. technologies.azure-container-apps: The document describes deploying FastAPI on Azure Container
    Apps, including configuration and scaling, but no existing term covers this specific Azure container
    platform. technologies.azure-container-registry: The document uses Azure Container Registry to store
    Docker images and configures access via managed identity; no existing term covers this service. technologies.azure-log-analytics:
    The document provisions and uses a Log Analytics workspace for platform and console logs; no existing
    term covers this Azure service. technologies.azure-managed-identity: The document uses a user-assigned
    managed identity to grant AcrPull permission without passwords; no existing term covers this Azure
    security feature. technologies.azure-monitor: The document plans to use Azure Monitor alongside Application
    Insights; no existing term covers this service. technologies.bm25: The document implements BM25 for
    keyword search; no existing term covers BM25. technologies.cors: The document configures CORS and
    discusses CORS preflight issues; no existing term covers CORS. technologies.faiss: The document uses
    FAISS for vector search; no existing term covers FAISS. technologies.fastapi: The document implements
    a FastAPI service with endpoints and validation; no existing term covers FastAPI. technologies.grafana:
    The document mentions evaluating Grafana for dashboards; no existing term covers Grafana. technologies.opentelemetry:
    The document plans to use OpenTelemetry for tracing and metrics; no existing term covers OpenTelemetry.
    technologies.pydantic: The document uses Pydantic for request validation; no existing term covers
    Pydantic. technologies.reciprocal-rank-fusion: The document uses Reciprocal Rank Fusion to combine
    BM25 and semantic rankings; no existing term covers this technique. technologies.sentence-transformers:
    The document uses sentence-transformers/all-MiniLM-L6-v2 to generate embeddings; no existing term
    covers this library. technologies.terraform: The document uses Terraform with the AzureRM provider
    to provision Azure resources; no existing term covers Terraform.'
preconditions:
  taxonomy_version: 2
