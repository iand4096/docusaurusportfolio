        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      technical-validation:
        label: Technical validation
        description: Testing and validation of technical content and integrations.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
