
# AI may propose changes, but only reviewed repository changes adopt them.

version: 2
governance:
  taxonomy_owner: repository reviewers
  ai_proposals_require_pr_review: true
  default_review: annual
technology_kinds:
  data-format:
    label: Data format
    description: A structured data serialisation or interchange format such as JSON, YAML, XML, or 
      SVG.
  payment-technology:
    label: Payment technology
    description: A payment-specific technical product, wallet integration, tokenisation technology, 
      checkout technology, or payment platform used in implementation work.
  programming-language:
    label: Programming language
    description: A general-purpose or domain-specific programming language.
  shell-scripting:
    label: Shell and scripting
    description: A shell, command language, or scripting environment used for automation.
  markup-content-language:
    label: Markup and content language
    description: A markup, content, or document syntax used to author structured text.
  framework:
    label: Framework
    description: A software framework that provides reusable structure for applications or tooling.
  library:
    label: Library
    description: A reusable software library or package.
  runtime:
    label: Runtime
    description: A runtime environment used to execute software.
  standard-specification:
    label: Standard or specification
    description: A formal technical standard, specification, or interoperable data definition.
  protocol:
    label: Protocol
    description: A technical communication, security, or directory protocol.
  api-tool:
    label: API tool
    description: A tool used to design, document, test, inspect, or work with APIs.
  documentation-platform:
    label: Documentation platform
    description: A documentation site generator or platform used to publish technical content.
  authoring-tool:
    label: Authoring tool
    description: A specialised application used to author or manage technical documentation.
  documentation-qa-tool:
    label: Documentation QA tool
    description: A deterministic spelling, grammar, prose, style, or documentation-quality tool.
  cms-wiki:
    label: CMS or wiki
    description: A content-management or wiki platform used to create and maintain content.
  developer-platform:
    label: Developer platform
    description: A hosted or local platform that supports software development workflows.
  developer-tool:
    label: Developer tool
    description: A general-purpose software-development tool not better represented by another kind.
  ide-editor:
    label: IDE or editor
    description: An integrated development environment or source-code editor.
  stylesheet-language:
    label: Stylesheet language
    description: A language used to describe the presentation and visual styling of structured 
      documents or web content.
  testing-debugging-tool:
    label: Testing or debugging tool
    description: A tool used to test, debug, inspect, or diagnose software systems.
  network-analysis-tool:
    label: Network analysis tool
    description: A tool used to inspect, capture, or analyse network traffic and protocols.
  ci-cd-automation:
    label: CI/CD and automation
    description: A continuous-integration, delivery, deployment, or build-automation technology.
  version-control:
    label: Version control
    description: A version-control technology or source-management system.
  container-platform:
    label: Container and orchestration platform
    description: A containerisation, orchestration, or workload-management platform.
  infrastructure-platform:
    label: Infrastructure platform
    description: A virtualisation, infrastructure, or systems-management platform.
  operating-system-firmware:
    label: Operating system or firmware
    description: An operating system, operating-system family, or device firmware platform.
  server-networking:
    label: Server and networking software
    description: A web server, application server, reverse proxy, or related networking technology.
  cloud-hosting-platform:
    label: Cloud or hosting platform
    description: A hosted development, deployment, or static-site platform.
  diagramming-visualisation:
    label: Diagramming and visualisation
    description: A tool or language used to create diagrams, charts, or technical visualisations.
  modelling-methodology:
    label: Modelling methodology
    description: A technical modelling notation, method, or structured architecture-modelling 
      approach.
  architecture-style:
    label: Architecture style
    description: A reusable software or systems architecture style used in technical work.
  technical-technique:
    label: Technical technique
    description: A reusable technical technique or capability that is materially demonstrated.
  security-cryptography:
    label: Security and cryptography
    description: A security, cryptography, identity, or trust technology not better represented as a
      protocol.
  ai-ml-tool:
    label: AI or ML tool
    description: An AI/ML model, assistant, API, platform, or development tool.
  data-analysis-tool:
    label: Data and analysis tool
    description: A data-processing, analysis, search, indexing, or data-oriented technology.
  design-graphics-tool:
    label: Design and graphics tool
    description: A graphics, illustration, or visual-design application used in technical work.
  engineering-design-tool:
    label: Engineering design tool
    description: A CAD, engineering, or product-design application.
  collaboration-project-tool:
    label: Collaboration and project tool
    description: A collaboration, annotation, issue-tracking, or project-management tool.
  software-platform:
    label: Software platform
    description: A reusable software product or application platform not better represented by 
      another kind.
dimensions:
  content_types:
    description: The structural or editorial type of the content.
    metadata_field: type
    required: true
    multiple: false
    min: 1
    max: 1
    docusaurus_tags: false
    ai_managed: true
    terms:
      case-study:
        label: Case study
        description: A documented example of work, approach and outcomes.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      landing-page:
        label: Landing page
        description: A page that introduces a section and provides navigation to its contents.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      skill:
        label: Skill
        description: A page describing a professional capability or area of expertise.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      tool:
        label: Tool
        description: A page describing a tool or technology used in technical writing or 
          documentation engineering.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
  audiences:
    description: Audiences for whom the content is materially relevant.
    metadata_field: audiences
    required: true
    multiple: true
    min: 1
    max: 3
    docusaurus_tags: false
    ai_managed: true
    terms:
      developers:
        label: Developers
        description: Software developers who consume APIs, SDKs, and developer documentation.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      documentation-managers:
        label: Documentation managers
        description: Managers and leads responsible for documentation strategy and teams.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      system-administrators:
        label: System administrators
        description: Administrators who manage systems, networks, or platforms.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      technical-writers:
        label: Technical writers
        description: Professionals who create and maintain technical documentation.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
  topics:
    description: Reusable subject areas substantially covered by the content.
    metadata_field: topics
    required: true
    multiple: true
    min: 1
    max: 5
    docusaurus_tags: true
    ai_managed: true
    terms:
      api-documentation:
        label: API documentation
        description: Creation and maintenance of documentation for application programming 
          interfaces.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      api-security:
        label: API security
        description: Security mechanisms and practices for APIs, including authentication, 
          encryption, and webhooks.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      developer-experience:
        label: Developer experience
        description: Design and improvement of developer portals, documentation, and tooling for 
          developers.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      docs-as-code:
        label: Docs-as-code
        description: Approach of treating documentation as code, using version control, CI/CD, and 
          automation.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      documentation-engineering:
        label: Documentation engineering
