        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      api-security:
        label: API security
        description: Security controls for APIs, including authentication, authorisation, request
          signing, transport security, encryption, credential management and secure webhook
          verification.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      developer-experience:
        label: Developer experience
        description: Design and improvement of developer portals, documentation, and tooling for
          developers.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      docs-as-code:
        label: Docs-as-code
        description: Managing documentation in version control and applying software development
          practices for collaboration, review, testing and publishing.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      documentation-engineering:
        label: Documentation engineering
        description: Designing, building and maintaining the software, integrations and automation
          that support documentation authoring, validation, publishing and discovery.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      documentation-governance:
        label: Documentation governance
        description: Processes and standards for managing documentation quality, metadata, and
          lifecycle.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      information-architecture:
        label: Information architecture
        description: Organisation and structure of information to improve findability and usability.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      payments:
        label: Payments
        description: Payment systems, digital wallets, tokenisation, and related financial
          technology.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      technical-validation:
        label: Technical validation
        description: Verifying documented behaviour, procedures, specifications and examples against
          working systems, source code or executable tests.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      technical-writing:
        label: Technical writing
        description: Planning, researching, writing and revising technical explanations, procedures,
          guides and references for their intended readers.
        governance:
          status: active
          introduced: '2026-08-14'
          source: initial-taxonomy
          review: annual
      taxonomy:
        label: Taxonomy
        description: Controlled vocabulary design, classification structures, taxonomy management,
          and taxonomy governance.
        governance:
          status: active
          introduced: '2026-09-01'
          source: human-proposed
          review: annual
      people-leadership:
        label: People leadership
        description: Recruiting, managing, mentoring and developing teams, including collaboration
