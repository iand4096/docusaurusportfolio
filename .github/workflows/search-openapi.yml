name: Validate Search API reference

on:
  pull_request:
    paths:
      - 'knowledge-api/**'
      - 'static/api/search-openapi.json'
      - '.github/workflows/search-openapi.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge-api/**'
      - 'static/api/search-openapi.json'
      - '.github/workflows/search-openapi.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: knowledge-api/requirements-openapi-linux-py312.lock
      - name: Install OpenAPI export dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r knowledge-api/requirements-openapi-linux-py312.lock
      - name: Check the published schema for drift
        run: python knowledge-api/export_openapi.py --check
