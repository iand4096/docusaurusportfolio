name: Taxonomy validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taxonomy-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-taxonomy:
    name: Validate taxonomy and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-doc-review.txt

      - name: Validate taxonomy and changed documents
        run: |
          python scripts/taxonomy.py check --changed-base "${{ github.event.pull_request.base.sha }}"

      - name: Test taxonomy policies and migrations
        run: python -m unittest discover -s scripts/tests -p 'test_*taxonomy.py'

  validate-see-also:
    name: Validate generated See also links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Test related links and taxonomy filters
        run: |
          npm run test:see-also
          npm run test:taxonomy-filters
      - name: Check committed related-link artifacts
        run: npm run see-also:check
