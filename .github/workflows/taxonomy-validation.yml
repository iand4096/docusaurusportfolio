name: Taxonomy validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taxonomy-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-taxonomy:
    name: Validate taxonomy and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate taxonomy and changed documents
        run: |
          python scripts/taxonomy.py check --changed-base "${{ github.event.pull_request.base.sha }}"