name: Documentation QA

on:
  # Allow the workflow to be run manually from the Actions tab.
  workflow_dispatch:

  # Run after documentation-related changes are pushed to main.
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "scripts/ai_docs_review.py"
      - "requirements-doc-review.txt"
      - ".github/workflows/docs-review.yml"

  # Run when a pull request targeting main changes documentation
  # or the documentation-review tooling.
  pull_request:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "scripts/ai_docs_review.py"
      - "requirements-doc-review.txt"
      - ".github/workflows/docs-review.yml"

# The documentation checker only needs read access to the repository.
permissions:
  contents: read

# If several commits are pushed quickly to the same branch/PR,
# cancel the older QA run to avoid unnecessary API calls.
concurrency:
  group: docs-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-review:
    name: Review documentation

    # Do not run the secret-backed AI review for pull requests
    # originating from forks.
    #
    # Forked pull_request workflows do not receive repository secrets
    # anyway, but this avoids starting a job that cannot use the API.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-doc-review.txt

      - name: Verify DeepSeek API key is available
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY repository secret is not configured."
            exit 1
          fi

          echo "DeepSeek API key is configured."

      - name: Run documentation QA
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ai_docs_review.py \
            --ci \
            --mode per-page \
            --filter full \
            --fail-high 0 \
            --fail-medium 5 \
            --fail-api-errors 0

      # Upload the reports even when the QA step fails because of
      # high/medium findings. This lets you inspect what caused
      # the workflow to fail.
      - name: Upload documentation review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-review
          path: |
            ai-doc-review.html
            ai-doc-review.json
          if-no-files-found: warn