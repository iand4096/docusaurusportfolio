name: Documentation QA

on:
  # Allow manual runs from the GitHub Actions tab.
  workflow_dispatch:

  # Run when documentation or QA tooling changes on main.
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "scripts/ai_docs_review.py"
      - "requirements-doc-review.txt"
      - ".github/workflows/docs-review.yml"

  # Run for pull requests targeting main when documentation
  # or QA tooling changes.
  pull_request:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "scripts/ai_docs_review.py"
      - "requirements-doc-review.txt"
      - ".github/workflows/docs-review.yml"

# The documentation QA workflow only needs repository read access.
permissions:
  contents: read

# If several commits are pushed quickly, cancel the older QA run
# to avoid unnecessary API usage.
concurrency:
  group: docs-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-review:
    name: Review documentation

    # Do not run the secret-backed AI review for pull requests
    # originating from forks.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Repository
      # ------------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-doc-review.txt

      # ------------------------------------------------------------
      # Secret check
      # ------------------------------------------------------------

      - name: Verify DeepSeek API key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY repository secret is not configured."
            exit 1
          fi

          echo "DeepSeek API key is configured."

      # ------------------------------------------------------------
      # Documentation QA
      # ------------------------------------------------------------

      - name: Run documentation QA
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ai_docs_review.py \
            --ci \
            --mode per-page \
            --filter full \
            --fail-high 0 \
            --fail-medium 5 \
            --fail-api-errors 0

      # ------------------------------------------------------------
      # Upload reports
      #
      # always() means this still runs when the QA command returns
      # exit code 1 because a threshold was exceeded.
      # ------------------------------------------------------------

      - name: Upload documentation review report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-review
          path: |
            ai-doc-review.html
            ai-doc-review.json
          if-no-files-found: warn

      # ------------------------------------------------------------
      # GitHub Actions summary
      #
      # This puts an obvious report link on the workflow-run page,
      # instead of requiring you to open the upload-artifact step.
      # ------------------------------------------------------------

      - name: Add QA report to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Documentation QA"
            echo ""
            echo "### Generated reports"
            echo ""
            echo "- \`ai-doc-review.html\` — human-readable QA report"
            echo "- \`ai-doc-review.json\` — structured QA results"
            echo ""

            if [ -n "${{ steps.upload-report.outputs.artifact-url }}" ]; then
              echo "### Download"
              echo ""
              echo "[Download documentation-review artifact](${{ steps.upload-report.outputs.artifact-url }})"
              echo ""
            else
              echo "> No documentation-review artifact was created."
              echo ""
              echo "Check the workflow logs to determine why the report files were not generated."
            fi

            echo ""
            echo "### CI thresholds"
            echo ""
            echo "| Finding | Allowed |"
            echo "|---|---:|"
            echo "| High severity | 0 |"
            echo "| Medium severity | 5 |"
            echo "| API/check errors | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"