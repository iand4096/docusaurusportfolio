name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus and QA report
    runs-on: ubuntu-latest

    outputs:
      qa-outcome: ${{ steps.docs-qa.outcome }}
      qa-report-path: ${{ steps.add-qa-report.outputs.report-path }}
      qa-report-version: ${{ steps.add-qa-report.outputs.report-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare documentation QA
        uses: ./.github/actions/setup-docs-qa

      # Build before running paid AI review.
      - name: Build Docusaurus site
        env:
          # Expose the deployment version to Docusaurus. The QA route itself also
          # uses a versioned report file below, so this is safe even if the site
          # configuration does not currently consume QA_VERSION.
          QA_VERSION: ${{ github.sha }}
          RAG_SEARCH_ENABLED: "true"
          RAG_API_URL: "https://ca-portfolio-rag.calmpebble-4a73febf.uksouth.azurecontainerapps.io"
        run: npm run build

      # Remove any QA output already present from the checked-out repository or
      # Docusaurus build. This prevents a failed QA run from republishing a stale
      # ai-doc-review.html from an earlier commit.
      - name: Remove stale QA report outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f ai-doc-review.html ai-doc-review.json .qa-run-start
          rm -rf build/qa

          # Record the start of this QA run. Any report copied into the Pages
          # artifact must be newer than this marker.
          touch .qa-run-start

          echo "Stale QA report outputs removed."
          echo "QA run freshness marker created."

      # continue-on-error is intentional. If the QA thresholds fail,
      # the report is still copied into the Pages build and deployed.
      # The qa-gate job below then restores the failure status.
      - name: Run documentation QA
        id: docs-qa
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY repository secret is not configured."
            exit 1
          fi

          echo "Python:"
          python --version

          echo "Vale:"
          vale --version

          echo "mdx2vast:"
          command -v mdx2vast

          echo "Java:"
          java --version

          echo "LTeX+:"
          ltex-cli-plus --version

          echo "Lychee:"
          lychee --version

          python scripts/ai_docs_review.py \
            --ci \
            --mode per-page \
            --filter full \
            --fail-high 0 \
            --fail-medium 25 \
            --fail-api-errors 0

      # Verify that any generated report belongs to this workflow run. The stale
      # outputs were deleted immediately before QA, and this timestamp check adds
      # a second guard against accidentally publishing an older report.
      - name: Verify QA report freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ai-doc-review.html ]; then
            if [ ai-doc-review.html -nt .qa-run-start ]; then
              echo "HTML QA report is fresh."
            else
              echo "::warning::ai-doc-review.html is not newer than the QA run marker; removing it."
              rm -f ai-doc-review.html
            fi
          else
            echo "No HTML QA report was generated."
          fi

          if [ -f ai-doc-review.json ]; then
            if [ ai-doc-review.json -nt .qa-run-start ]; then
              echo "JSON QA report is fresh."
            else
              echo "::warning::ai-doc-review.json is not newer than the QA run marker; removing it."
              rm -f ai-doc-review.json
            fi
          else
            echo "No JSON QA report was generated."
          fi

      # Keep the source HTML and JSON available as a normal Actions
      # artifact as well as publishing the HTML report under /qa/.
      - name: Upload documentation QA artifact
        id: upload-qa-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-review
          path: |
            ai-doc-review.html
            ai-doc-review.json
            ai-doc-review.md
          if-no-files-found: warn

      # Publish the QA report under a commit-specific filename. /qa/index.html is
      # a small stable loader that fetches version.json with a cache-busting query
      # parameter and redirects to the immutable, SHA-versioned report. This avoids
      # stale QA HTML when GitHub Pages or the browser caches /qa/.
      - name: Add QA report to site
        id: add-qa-report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          QA_VERSION="${GITHUB_SHA:0:12}"
          REPORT_NAME="report-${QA_VERSION}.html"
          REPORT_PATH="build/qa/${REPORT_NAME}"

          mkdir -p build/qa

          if [ -f ai-doc-review.html ]; then
            cp ai-doc-review.html "$REPORT_PATH"
            echo "QA report copied to $REPORT_PATH."
          else
            echo "::warning::ai-doc-review.html was not generated."

            cat > "$REPORT_PATH" <<'EOF'
          <!doctype html>
          <html lang="en-GB">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <title>Documentation QA</title>
            <style>
              body {
                max-width: 800px;
                margin: 60px auto;
                padding: 0 24px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.6;
              }

              .error {
                padding: 20px;
                border: 1px solid #dc2626;
                border-radius: 8px;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Documentation QA</h1>
              <div class="error">
                <h2>Report unavailable</h2>
                <p>
                  The documentation QA workflow did not generate an HTML report.
                </p>
                <p>
                  Check the corresponding GitHub Actions workflow run for details.
                </p>
              </div>
            </main>
          </body>
          </html>
          EOF
          fi

          # QA_LINKS_PUBLISH_V1: publish matching machine-readable reports with the HTML.

          # Each deployment uses commit-specific filenames to keep report links in sync.

          if [ -f ai-doc-review.html ]; then

            if [ ! -s ai-doc-review.json ] || [ ! -s ai-doc-review.md ]; then

              echo "::error::HTML QA report was generated without matching JSON and Markdown files."

              exit 1

            fi

            cp ai-doc-review.json "build/qa/report-${QA_VERSION}.json"

            cp ai-doc-review.md "build/qa/report-${QA_VERSION}.md"

            QA_VERSION="$QA_VERSION" python - <<'PY_QA_LINKS'

          from pathlib import Path

          import os

          version = os.environ["QA_VERSION"]

          report = Path("build/qa") / f"report-{version}.html"

          html = report.read_text(encoding="utf-8")

          for extension in ("json", "md"):

              html = html.replace(

                  f'href="ai-doc-review.{extension}"',

                  f'href="report-{version}.{extension}"',

              )

          report.write_text(html, encoding="utf-8")

          PY_QA_LINKS

            echo "Published QA HTML, JSON and Markdown for ${QA_VERSION}."

          fi

          # A small machine-readable pointer to the report from this deployment.
          # The /qa/ loader requests this file with a unique timestamp query string.
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          version = sha[:12]
          payload = {
              "sha": sha,
              "version": version,
              "report": f"report-{version}.html",
              "generatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }

          Path("build/qa/version.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("build/qa/deployment-version.txt").write_text(sha + "\n", encoding="utf-8")
          PY

          # Keep /qa/ as the human-friendly URL. The loader itself can safely be
          # cached because it always asks for version.json with a cache-busting
          # query parameter before redirecting to the versioned report.
          cat > build/qa/index.html <<'EOF'
          <!doctype html>
          <html lang="en-GB">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>Documentation QA</title>
            <style>
              body {
                max-width: 800px;
                margin: 60px auto;
                padding: 0 24px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.6;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Documentation QA</h1>
              <p id="qa-status">Loading the latest QA report…</p>
              <noscript>
                <p>JavaScript is required to resolve the latest versioned QA report.</p>
              </noscript>
            </main>
            <script>
              (async () => {
                const status = document.getElementById('qa-status');

                try {
                  const response = await fetch(
                    `./version.json?_qa=${Date.now()}`,
                    {cache: 'no-store'},
                  );

                  if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                  }

                  const version = await response.json();

                  if (!version.report || !version.sha) {
                    throw new Error('Invalid QA version metadata');
                  }

                  const target =
                    `./${encodeURIComponent(version.report)}?v=${encodeURIComponent(version.sha)}`;

                  window.location.replace(target);
                } catch (error) {
                  console.error('Unable to resolve the latest QA report:', error);
                  status.textContent =
                    'Unable to load the latest QA report. Refresh the page to try again.';
                }
              })();
            </script>
          </body>
          </html>
          EOF

          # Expose the versioned report path to later jobs and workflow summaries.
          echo "report-path=qa/${REPORT_NAME}" >> "$GITHUB_OUTPUT"
          echo "report-version=${QA_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Stable QA URL: qa/"
          echo "Versioned QA report: qa/${REPORT_NAME}"

      # Ask search engines not to index any generated QA HTML.
      # This is not access control: /qa/ remains a public URL.
      - name: Add noindex to QA report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          qa_dir = Path("build/qa")
          noindex = '<meta name="robots" content="noindex,nofollow">'

          if not qa_dir.is_dir():
              raise SystemExit(0)

          for path in qa_dir.glob("*.html"):
              content = path.read_text(encoding="utf-8")

              if noindex not in content and "<head>" in content:
                  content = content.replace(
                      "<head>",
                      f"<head>\n    {noindex}",
                      1,
                  )
                  path.write_text(content, encoding="utf-8")
                  print(f"Added noindex to {path}")
          PY

      - name: Verify published QA bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          test -s build/qa/index.html || {
            echo "::error::build/qa/index.html is missing or empty."
            exit 1
          }

          test -s build/qa/version.json || {
            echo "::error::build/qa/version.json is missing or empty."
            exit 1
          }

          REPORT_FILE="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("build/qa/version.json").read_text(encoding="utf-8"))
          print(data["report"])
          PY
          )"

          test -s "build/qa/$REPORT_FILE" || {
            echo "::error::Versioned QA report build/qa/$REPORT_FILE is missing or empty."
            exit 1
          }

          echo "QA loader: build/qa/index.html"
          echo "QA metadata: build/qa/version.json"
          echo "QA report: build/qa/$REPORT_FILE"

      - name: Add QA information to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Documentation QA"
            echo ""
            echo "QA step outcome: \`${{ steps.docs-qa.outcome }}\`"
            echo ""

            echo "### Checks"
            echo ""
            echo "- AI documentation review — DeepSeek"
            echo "- Static documentation checks"
            echo "- Vale prose/style checks"
            echo "- LTeX+ grammar/spelling checks — British English (en-GB)"
            echo "- Lychee external HTTP(S) link checks"
            echo ""
            echo "Vale findings are incorporated into the unified report with source \`vale\`."
            echo "Lychee findings are incorporated into the unified report with source \`lychee\`."
            echo "LTeX+ findings are incorporated into the unified report with source \`ltex\`."
            echo ""

            echo "The HTML report is included in this GitHub Pages deployment under \`/qa/\`."
            echo "Versioned report: \`${{ steps.add-qa-report.outputs.report-path }}\`"
            echo "Deployment version: \`${{ steps.add-qa-report.outputs.report-version }}\`"
            echo ""

            if [ -n "${{ steps.upload-qa-artifact.outputs.artifact-url }}" ]; then
              echo "### Original report files"
              echo ""
              echo "[Download documentation-review artifact](${{ steps.upload-qa-artifact.outputs.artifact-url }})"
              echo ""
            fi

            echo "### CI thresholds"
            echo ""
            echo "| Finding | Allowed |"
            echo "|---|---:|"
            echo "| High severity | 0 |"
            echo "| Medium severity | 25 |"
            echo "| API/check errors | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add published URLs to workflow summary
        shell: bash
        run: |
          {
            echo "## GitHub Pages deployment"
            echo ""
            echo "### Portfolio"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "### Documentation QA"
            echo ""
            echo "Stable URL: ${{ steps.deployment.outputs.page_url }}qa/"
            echo ""
            echo "Versioned report: ${{ steps.deployment.outputs.page_url }}${{ needs.build.outputs.qa-report-path }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The QA command was allowed to continue so that a failing report
  # could still be published. This final job makes the overall workflow
  # fail when the QA thresholds were exceeded.
  qa-gate:
    name: Enforce documentation QA
    needs:
      - build
      - deploy

    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check build and QA result
        shell: bash
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          QA_OUTCOME="${{ needs.build.outputs.qa-outcome }}"

          echo "Build result: $BUILD_RESULT"
          echo "Deploy result: $DEPLOY_RESULT"
          echo "Documentation QA outcome: $QA_OUTCOME"

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::The build job did not complete successfully."
            exit 1
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::The Pages deployment did not complete successfully."
            exit 1
          fi

          if [ "$QA_OUTCOME" != "success" ]; then
            echo "::error::Documentation QA failed its configured thresholds."
            echo "The QA report was still published so the findings can be reviewed."
            exit 1
          fi

          echo "Documentation QA passed."