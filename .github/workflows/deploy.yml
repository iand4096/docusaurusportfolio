ame: Documentation QA

on:
  # Manual QA runs from the Actions tab.
  workflow_dispatch:

  # PR QA only. Pushes to main are reviewed by deploy.yml so the same
  # DeepSeek review is not paid for twice.
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "src/pages/**/*.md"
      - "src/pages/**/*.mdx"
      - "scripts/ai_docs_review.py"
      - "requirements-doc-review.txt"

      # Vale configuration and custom styles must also trigger QA.
      - ".vale.ini"
      - ".github/styles/**"
      - "styles/**"

      # Lychee configuration changes must also trigger QA.
      - "lychee.toml"
      - ".lycheeignore"

      - ".github/workflows/docs-review.yml"

permissions:
  contents: read

concurrency:
  group: docs-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-review:
    name: Review documentation

    # Repository secrets are not made available to untrusted fork PRs.
    # This condition prevents the secret-backed job from starting for them.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-doc-review.txt

      # The Python QA script invokes the Vale executable directly and parses
      # its JSON output into the unified documentation QA report. Vale uses
      # mdx2vast as an external parser for MDX files.
      - name: Install Vale and MDX support
        shell: bash
        run: |
          sudo snap install vale

          # Make Vale available to all following workflow steps.
          echo "/snap/bin" >> "$GITHUB_PATH"

          # Vale requires mdx2vast to lint MDX files.
          npm install --global mdx2vast

          echo "Vale:"
          /snap/bin/vale --version

          echo "mdx2vast:"
          command -v mdx2vast

      # Validate the repository Vale configuration and MDX parser before
      # running the documentation QA script.
      - name: Validate Vale configuration
        shell: bash
        run: |
          if [ ! -f ".vale.ini" ]; then
            echo "::error::.vale.ini was not found at the repository root."
            exit 1
          fi

          if ! command -v mdx2vast >/dev/null 2>&1; then
            echo "::error::mdx2vast was not found in PATH. Vale cannot lint MDX files."
            exit 1
          fi

          echo "Vale configuration found."
          echo "mdx2vast: $(command -v mdx2vast)"

          vale sync
          vale ls-config

      # The Python QA script invokes Lychee directly to check external HTTP(S)
      # links and parses its JSON output into the unified QA report.
      - name: Install Lychee
        shell: bash
        run: |
          sudo snap install lychee

          # /snap/bin is already added above for Vale, but use the absolute
          # path here so installation is verified immediately.
          /snap/bin/lychee --version

      # Validate that Lychee starts successfully with the same core options
      # used by scripts/ai_docs_review.py. lychee.toml and .lycheeignore are
      # optional; Lychee will load them automatically when present.
      - name: Validate Lychee configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Lychee configuration:"
          if [ -f "lychee.toml" ]; then
            echo "  lychee.toml: found"
          else
            echo "  lychee.toml: not present (using defaults)"
          fi

          if [ -f ".lycheeignore" ]; then
            echo "  .lycheeignore: found"
          else
            echo "  .lycheeignore: not present"
          fi

          # GitHub Actions runs Bash with `-e`; temporarily disable it so
          # Lychee exit code 2 can be inspected rather than aborting this step.
          set +e
          printf '%s\n' "README.md" | lychee \
            --files-from - \
            --root-dir "$(pwd)" \
            --include '^https?://' \
            --format json \
            --no-progress \
            > /tmp/lychee-preflight.json
          LYCHEE_EXIT=$?
          set -e

          # Exit code 0 means all links passed. Exit code 2 means broken links
          # were found, which still proves that Lychee and its configuration
          # loaded successfully. Exit codes 1 and 3 indicate execution/config
          # problems and should stop the workflow before paid AI checks run.
          if [ "$LYCHEE_EXIT" -ne 0 ] && [ "$LYCHEE_EXIT" -ne 2 ]; then
            echo "::error::Lychee preflight failed with exit code $LYCHEE_EXIT."
            cat /tmp/lychee-preflight.json || true
            exit "$LYCHEE_EXIT"
          fi

          echo "Lychee configuration loaded successfully."

      - name: Verify DeepSeek API key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY repository secret is not configured."
            exit 1
          fi

          echo "DeepSeek API key is configured."

      - name: Run documentation QA
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Python:"
          python --version

          echo "Vale:"
          vale --version

          echo "mdx2vast:"
          command -v mdx2vast

          echo "Lychee:"
          lychee --version

          python scripts/ai_docs_review.py \
            --ci \
            --mode per-page \
            --filter full \
            --fail-high 0 \
            --fail-medium 5 \
            --fail-api-errors 0

      # This still runs when the QA command fails its thresholds.
      - name: Upload documentation review report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-review
          path: |
            ai-doc-review.html
            ai-doc-review.json
          if-no-files-found: warn

      - name: Add QA report to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Documentation QA"
            echo ""

            echo "### Checks"
            echo ""
            echo "- AI documentation review — DeepSeek"
            echo "- Static documentation checks"
            echo "- Vale prose/style checks"
            echo "- Lychee external HTTP(S) link checks"
            echo ""
            echo "Vale findings are incorporated into the unified reports with source \`vale\`."
            echo "Lychee findings are incorporated into the unified reports with source \`lychee\`."
            echo ""

            echo "### Generated reports"
            echo ""
            echo "- \`ai-doc-review.html\` — human-readable unified QA report"
            echo "- \`ai-doc-review.json\` — structured unified QA results"
            echo ""

            if [ -n "${{ steps.upload-report.outputs.artifact-url }}" ]; then
              echo "### Download"
              echo ""
              echo "[Download documentation-review artifact](${{ steps.upload-report.outputs.artifact-url }})"
              echo ""
            else
              echo "> No documentation-review artifact was created."
              echo ""
              echo "Check the workflow logs to determine why the report files were not generated."
              echo ""
            fi

            echo "### CI thresholds"
            echo ""
            echo "| Finding | Allowed |"
            echo "|---|---:|"
            echo "| High severity | 0 |"
            echo "| Medium severity | 5 |"
            echo "| API/check errors | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"