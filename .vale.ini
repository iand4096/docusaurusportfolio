StylesPath = .github/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Portfolio
# Ignore MDX comments (including heading anchors), not the surrounding prose.
TokenIgnores = (?s)(\{/\*.*?\*/\})
# Ignore standalone, single-line JavaScript imports with a quoted module path.
BlockIgnores = (?m)^[ \t]*(import[ \t]+[^\r\n;]*["'][^"'\r\n]+["'][ \t]*;?[ \t]*)$

[LICENSE.md]
Portfolio.PortfolioClaims = NO

[*.mdx]
BasedOnStyles = Portfolio
TokenIgnores = (?s)(\{/\*.*?\*/\})
BlockIgnores = (?m)^[ \t]*(import[ \t]+[^\r\n;]*["'][^"'\r\n]+["'][ \t]*;?[ \t]*)$
